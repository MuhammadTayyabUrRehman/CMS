# Nginx reverse proxy for the Ministry of Finance Complaint Portal.
#
# Single entry point: serves the built frontend (static files) and proxies
# /api/* and /api-docs to the NestJS backend, so only one port is exposed.
#
# Paths below assume:
#   - frontend static build at /usr/share/nginx/html
#   - backend listening on 127.0.0.1:3001
# Adjust to match your environment.

upstream complaint_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- Security headers ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Backend API ---
    location /api/ {
        proxy_pass http://complaint_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # --- Swagger docs ---
    location /api-docs {
        proxy_pass http://complaint_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health check (no auth) ---
    location = /api/health {
        proxy_pass http://complaint_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Frontend static assets ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- Static asset caching ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
